<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ananta & Desy – Wedding Invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Dancing+Script:wght@500;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap"
    rel="stylesheet">

  <style>
    /* ─── RESET & BASE ─── */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --burg: #7a2444;
      --burg-l: #9e3558;
      --olive: #4a5e1e;
      --olive-m: #6a7e30;
      --pink: #d4789e;
      --pink-l: #e8a8c4;
      --gold: #c9a84c;
      --cream: #f6f0e8;
      --cream-d: #ede3d4;
    }

    html,
    body {
      font-family: 'Cormorant Garamond', serif;
      background: #b5a898;
      min-height: 100%;
    }

    /* ─── APP SHELL ─── */
    .shell {
      width: 100%;
      max-width: 430px;
      min-height: 100svh;
      margin: 0 auto;
      background: var(--cream);
      position: relative;
      overflow: hidden;
    }

    /* ─── PAGES ─── */
    .page {
      width: 100%;
      min-height: 100svh;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ═══════════════════════════════════════
   PAGE 1 — COVER
═══════════════════════════════════════ */
    #p1 {
      background: var(--cream);
      z-index: 2;
    }

    /* ── Floral layer ── */
    .fl-wrap {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: visible;
    }

    /* ── SWAY animations ── */
    @keyframes sway {

      0%,
      100% {
        transform: rotate(0deg);
      }

      30% {
        transform: rotate(3deg);
      }

      70% {
        transform: rotate(-2.5deg);
      }
    }

    @keyframes swayR {

      0%,
      100% {
        transform: rotate(0deg) scaleX(-1);
      }

      30% {
        transform: rotate(-3deg) scaleX(-1);
      }

      70% {
        transform: rotate(2.5deg) scaleX(-1);
      }
    }

    @keyframes petalBloom {
      0% {
        transform: scale(0) rotate(-30deg);
        opacity: 0;
      }

      60% {
        transform: scale(1.15) rotate(5deg);
        opacity: 1;
      }

      100% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    @keyframes floatUp {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes shimmer {
      0% {
        opacity: .7;
      }

      50% {
        opacity: 1;
      }

      100% {
        opacity: .7;
      }
    }

    /* ─ CORNER SVG stems ─ */
    .c-stem {
      position: absolute;
      transform-origin: bottom center;
    }

    .c-stem.tl {
      top: 0;
      left: 0;
      transform-origin: top left;
      animation: sway 4s ease-in-out infinite;
    }

    .c-stem.tr {
      top: 0;
      right: 0;
      transform-origin: top right;
      animation: swayR 4.3s ease-in-out infinite;
    }

    .c-stem.bl {
      bottom: 0;
      left: 0;
      transform-origin: bottom left;
      animation: sway 3.8s ease-in-out 0.5s infinite;
    }

    .c-stem.br {
      bottom: 0;
      right: 0;
      transform-origin: bottom right;
      animation: swayR 4.1s ease-in-out 0.3s infinite;
    }

    /* ─ SIDE stems ─ */
    .s-stem {
      position: absolute;
      top: 50%;
      transform-origin: bottom center;
    }

    .s-stem.left {
      left: 0;
      transform: translateY(-50%);
      animation: sway 3.6s ease-in-out 1s infinite;
    }

    .s-stem.right {
      right: 0;
      transform: translateY(-50%) scaleX(-1);
      animation: swayR 3.9s ease-in-out 0.7s infinite;
    }

    /* ─ Blooming flowers ─ */
    .bloom {
      position: absolute;
      animation: petalBloom 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) both,
        floatUp 3.5s ease-in-out 1.5s infinite;
    }

    .bloom:nth-child(2) {
      animation-delay: 0.25s, 1.75s;
    }

    .bloom:nth-child(3) {
      animation-delay: 0.45s, 2.0s;
    }

    .bloom:nth-child(4) {
      animation-delay: 0.15s, 1.6s;
    }

    .bloom:nth-child(5) {
      animation-delay: 0.6s, 2.2s;
    }

    .bloom:nth-child(6) {
      animation-delay: 0.35s, 1.9s;
    }

    /* ── Cover content ── */
    .cover-body {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 0 76px;
    }

    .lbl-wedding {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(1.15rem, 4vw, 1.5rem);
      /* bigger */
      color: var(--burg);
      letter-spacing: .14em;
      margin-bottom: clamp(12px, 3.5vh, 20px);
      opacity: 0;
      animation: fadeUp .8s .3s forwards;
    }

    .lbl-invitation {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(.85rem, 2.8vw, 1.1rem);
      color: var(--olive-m);
      letter-spacing: .25em;
      text-transform: uppercase;
      margin-top: -6px;
      margin-bottom: clamp(14px, 4vh, 22px);
      opacity: 0;
      animation: fadeUp .8s .5s forwards;
    }

    .img-wrap {
      width: clamp(185px, 52vw, 258px);
      margin-bottom: clamp(14px, 3.8vh, 22px);
      opacity: 0;
      animation: fadeUp .9s .65s forwards;
      filter: drop-shadow(0 6px 18px rgba(122, 36, 68, .22));
    }

    .img-wrap img {
      width: 100%;
      display: block;
    }

    .txt-hello {
      font-size: clamp(.8rem, 2.6vw, 1rem);
      color: var(--burg);
      letter-spacing: .2em;
      text-transform: uppercase;
      margin-bottom: 3px;
      opacity: 0;
      animation: fadeUp .8s .9s forwards;
    }

    .txt-recipient {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(1.4rem, 5.5vw, 1.85rem);
      color: var(--olive);
      font-weight: 600;
      margin-bottom: clamp(18px, 5vh, 30px);
      opacity: 0;
      animation: fadeUp .8s 1.05s forwards;
    }

    .btn-open {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(.8rem, 2.6vw, 1rem);
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--burg);
      background: transparent;
      border: 1.5px solid var(--burg);
      padding: clamp(10px, 3vw, 13px) clamp(28px, 8vw, 44px);
      border-radius: 3px;
      cursor: pointer;
      transition: background .3s, color .3s, transform .15s;
      opacity: 0;
      animation: fadeUp .8s 1.2s forwards;
    }

    .btn-open:hover {
      background: var(--burg);
      color: var(--cream);
      transform: translateY(-2px);
    }

    .btn-open:active {
      transform: translateY(0);
    }

    /* ═══════════════════════════════════════
   PAGE 2 — VIDEO
═══════════════════════════════════════ */
    #p2 {
      display: none;
      opacity: 0;
      transition: opacity .5s ease;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      min-height: 100svh;
      background: url('bg.PNG') center center / cover no-repeat;
      z-index: 1;
    }

    #p2.visible {
      display: flex;
    }

    #p2.show {
      opacity: 1;
    }

    /* video card */
    .vid-outer {
      position: relative;
      z-index: 1;
      width: clamp(220px, 62vw, 290px);
      background: rgba(248, 242, 234, 0.88);
      border-radius: 14px;
      padding: 3px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, .4);
      border: 2.5px solid var(--burg);
    }

    .vid-inner {
      background: var(--cream-d);
      border-radius: 11px;
      overflow: hidden;
    }

    .vid-header {
      padding: 14px 10px 8px;
      text-align: center;
    }

    .vid-small {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(.9rem, 3.2vw, 1.1rem);
      color: var(--burg);
      font-weight: 600;
    }

    .vid-big {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(1.25rem, 4.8vw, 1.6rem);
      color: var(--burg);
      font-weight: 700;
    }

    .vid-player {
      position: relative;
      background: #111;
      width: 100%;
    }

    .vid-player video {
      width: 100%;
      display: block;
      aspect-ratio: 9/16;
      object-fit: cover;
    }

    .vid-footer {
      padding: 9px 10px 13px;
      text-align: center;
      font-style: italic;
      font-size: clamp(.72rem, 2.3vw, .9rem);
      color: var(--olive);
      letter-spacing: .08em;
    }

    /* ═══════════════════════════════════════
   DESKTOP
═══════════════════════════════════════ */
    @media (min-width:600px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px 0;
      }

      .shell {
        min-height: 0;
        height: min(860px, 95vh);
        border-radius: 14px;
        box-shadow: 0 28px 72px rgba(0, 0, 0, .45);
        overflow: hidden;
      }

      .page {
        min-height: 100%;
        height: 100%;
      }

      #p2 {
        height: 100%;
      }
    }
  </style>
</head>

  <script>
    function openInvitation() {
      const p1 = document.getElementById('p1');
      const p2 = document.getElementById('p2');

      // slide p1 up
      p1.style.transition = 'transform 0.85s cubic-bezier(0.77,0,0.175,1)';
      p1.style.position = 'absolute';
      p1.style.top = '0';
      p1.style.left = '0';
      p1.style.width = '100%';
      p1.style.zIndex = '10';
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          p1.style.transform = 'translateY(-100%)';
        });
      });

      // show p2
      p2.classList.add('visible');
      requestAnimationFrame(() => {
        requestAnimationFrame(() => { p2.classList.add('show'); });
      });

      // autoplay video
      setTimeout(() => {
        const vid = document.getElementById('weddingVideo');
        vid.muted = false;
        vid.play().catch(() => { vid.muted = true; vid.play(); });
      }, 850);
    }
  </script>
