<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ananta & Desy - Wedding Invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Dancing+Script:wght@600;700&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --burgundy: #7a2444;
      --olive: #5a6b2a;
      --olive-mid: #7a8f3a;
      --cream: #f5efe6;
      --cream-dark: #ede3d4;
    }

    html,
    body {
      font-family: 'Cormorant Garamond', serif;
      background: #c4b8aa;
      min-height: 100%;
    }

    /* ── PHONE SHELL ── */
    .app-shell {
      width: 100%;
      max-width: 430px;
      min-height: 100svh;
      /* small viewport height — mobile-safe */
      margin: 0 auto;
      background: var(--cream);
      position: relative;
      overflow: hidden;
    }

    /* ── PAGES ── */
    .page {
      width: 100%;
      min-height: 100svh;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ════════════════════════════
     PAGE 1 — COVER
  ════════════════════════════ */
    #page1 {
      background: var(--cream);
      z-index: 2;
      transition: transform 0.85s cubic-bezier(0.77, 0, 0.175, 1);
    }

    #page1.slide-away {
      transform: translateY(-100%);
      position: fixed;
      /* keep it in place while sliding */
      top: 0;
      left: 50%;
      transform: translateX(-50%) translateY(-100%);
      width: min(430px, 100%);
    }

    /* floral background layer */
    .floral-wrap {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    /* corner / side SVG helpers */
    .c-svg {
      position: absolute;
    }

    .c-tl {
      top: 0;
      left: 0;
    }

    .c-tr {
      top: 0;
      right: 0;
      transform: scaleX(-1);
      transform-origin: right top;
    }

    .c-bl {
      bottom: 0;
      left: 0;
      transform: scaleY(-1);
      transform-origin: left bottom;
    }

    .c-br {
      bottom: 0;
      right: 0;
      transform: scale(-1, -1);
      transform-origin: right bottom;
    }

    .s-svg {
      position: absolute;
    }

    .s-left {
      left: 0;
      top: 50%;
      transform: translateY(-50%);
    }

    .s-right {
      right: 0;
      top: 50%;
      transform: translateY(-50%) scaleX(-1);
      transform-origin: right center;
    }

    /* cover body */
    .cover-inner {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      /* horizontal padding = room for side flowers (≈60-70px each side) */
      padding: 0 72px;
      gap: 0;
    }

    .lbl-inv {
      font-style: italic;
      font-size: clamp(0.78rem, 2.4vw, 1rem);
      color: var(--burgundy);
      letter-spacing: .18em;
      margin-bottom: clamp(12px, 3.5vh, 22px);
      opacity: 0;
      animation: fadeUp .8s .3s forwards;
    }

    .img-wrap {
      width: clamp(185px, 52vw, 260px);
      margin-bottom: clamp(14px, 3.8vh, 22px);
      opacity: 0;
      animation: fadeUp .9s .5s forwards;
      filter: drop-shadow(0 6px 18px rgba(122, 36, 68, .2));
    }

    .img-wrap img {
      width: 100%;
      display: block;
    }

    .txt-hello {
      font-size: clamp(.78rem, 2.4vw, .95rem);
      color: var(--burgundy);
      letter-spacing: .2em;
      text-transform: uppercase;
      margin-bottom: 4px;
      opacity: 0;
      animation: fadeUp .8s .85s forwards;
    }

    .txt-recipient {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(1.3rem, 5vw, 1.75rem);
      color: var(--olive);
      font-weight: 600;
      margin-bottom: clamp(18px, 5vh, 30px);
      opacity: 0;
      animation: fadeUp .8s 1.0s forwards;
    }

    .btn-open {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(.78rem, 2.4vw, .95rem);
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--burgundy);
      background: transparent;
      border: 1.5px solid var(--burgundy);
      padding: clamp(10px, 3vw, 13px) clamp(26px, 7vw, 42px);
      border-radius: 3px;
      cursor: pointer;
      transition: background .3s, color .3s, transform .15s;
      opacity: 0;
      animation: fadeUp .8s 1.2s forwards;
    }

    .btn-open:hover {
      background: var(--burgundy);
      color: var(--cream);
      transform: translateY(-1px);
    }

    .btn-open:active {
      transform: translateY(0);
    }

    /* ════════════════════════════
     PAGE 2 — VIDEO
  ════════════════════════════ */
    #page2 {
      background: var(--cream);
      display: none;
      opacity: 0;
      transition: opacity .5s ease;
      z-index: 1;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
    }

    #page2.visible {
      display: flex;
    }

    #page2.show {
      opacity: 1;
    }

    /* video card — styled like reference image 3 */
    .vid-outer {
      position: relative;
      z-index: 1;
      width: clamp(240px, 68vw, 310px);
      background: #3d5218;
      border-radius: 18px;
      padding: 9px;
      box-shadow: 0 14px 44px rgba(0, 0, 0, .35);
    }

    .vid-outer::before {
      content: '';
      position: absolute;
      inset: 3px;
      border-radius: 15px;
      border: 1.5px solid rgba(201, 168, 76, .5);
      pointer-events: none;
    }

    .vid-inner {
      background: var(--cream-dark);
      border-radius: 10px;
      overflow: hidden;
    }

    .vid-header {
      padding: 13px 10px 7px;
      text-align: center;
    }

    .vid-title-small {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(.9rem, 3vw, 1.1rem);
      color: var(--burgundy);
      font-weight: 600;
      line-height: 1.25;
    }

    .vid-title-big {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(1.2rem, 4.5vw, 1.55rem);
      color: var(--burgundy);
      font-weight: 700;
    }

    .vid-player {
      position: relative;
      background: #111;
      width: 100%;
    }

    .vid-player video {
      width: 100%;
      display: block;
      aspect-ratio: 9/16;
      object-fit: cover;
    }

    /* corner vine overlay on video */
    .vid-vine {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    .vid-footer {
      padding: 9px 10px 13px;
      text-align: center;
      font-style: italic;
      font-size: clamp(.72rem, 2.2vw, .88rem);
      color: var(--olive);
      letter-spacing: .08em;
    }

    /* ── ANIMATION ── */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ════════════════════════════
     DESKTOP — phone frame
  ════════════════════════════ */
    @media (min-width:600px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px 0;
      }

      .app-shell {
        min-height: 0;
        height: min(860px, 95vh);
        border-radius: 14px;
        box-shadow: 0 28px 72px rgba(0, 0, 0, .45);
        overflow: hidden;
      }

      .page {
        min-height: 100%;
        height: 100%;
      }

      #page2 {
        height: 100%;
      }
    }
  </style>
</head>

  <script>
    function openInvitation() {
      const p1 = document.getElementById('page1');
      const p2 = document.getElementById('page2');

      // slide page 1 up
      p1.style.transition = 'transform 0.85s cubic-bezier(0.77,0,0.175,1)';
      p1.style.transform = 'translateY(-100%)';
      p1.style.position = 'absolute';
      p1.style.top = '0';
      p1.style.left = '0';
      p1.style.width = '100%';
      p1.style.zIndex = '10';

      // show page 2
      p2.style.display = 'flex';
      requestAnimationFrame(() => {
        requestAnimationFrame(() => { p2.style.opacity = '1'; });
      });

      // autoplay video after slide completes
      setTimeout(() => {
        const vid = document.getElementById('weddingVideo');
        vid.muted = false;
        vid.play().catch(() => { vid.muted = true; vid.play(); });
      }, 800);
    }
  </script>
