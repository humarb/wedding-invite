<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ananta & Desy - Wedding Invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Dancing+Script:wght@400;600;700&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --burgundy: #7a2444;
      --burgundy-light: #9e3558;
      --olive: #5a6b2a;
      --olive-light: #7a8f3a;
      --cream: #f5efe6;
      --cream-dark: #ede3d4;
      --blush: #f2d4d8;
      --gold: #c9a84c;
      --text-dark: #2d1f1f;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      font-family: 'Cormorant Garamond', serif;
      background: var(--cream);
    }

    /* ===== PAGES WRAPPER ===== */
    .pages-wrapper {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* ===== PAGE 1 - COVER ===== */
    #page-cover {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cream);
      overflow: hidden;
      z-index: 2;
      transition: transform 0.9s cubic-bezier(0.77, 0, 0.175, 1);
    }

    #page-cover.slide-up {
      transform: translateY(-100%);
    }

    /* Floral corner decorations */
    .floral-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    /* SVG floral corners */
    .corner-decor {
      position: absolute;
      width: 160px;
      height: 160px;
      opacity: 0.85;
    }

    .corner-tl {
      top: 0;
      left: 0;
    }

    .corner-tr {
      top: 0;
      right: 0;
      transform: scaleX(-1);
    }

    .corner-bl {
      bottom: 0;
      left: 0;
      transform: scaleY(-1);
    }

    .corner-br {
      bottom: 0;
      right: 0;
      transform: scale(-1, -1);
    }

    .side-flowers {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 90px;
      opacity: 0.8;
    }

    .side-left {
      left: 8px;
    }

    .side-right {
      right: 8px;
      transform: translateY(-50%) scaleX(-1);
    }

    /* Center content */
    .cover-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 20px;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .cover-label {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1rem;
      color: var(--burgundy);
      letter-spacing: 0.15em;
      margin-bottom: 16px;
      opacity: 0;
      animation: fadeInUp 0.8s 0.3s forwards;
    }

    /* Mirror frame for the image */
    .mirror-frame {
      position: relative;
      width: min(280px, 72vw);
      margin: 0 auto 20px;
      opacity: 0;
      animation: fadeInUp 0.9s 0.5s forwards;
    }

    .mirror-frame img {
      width: 100%;
      display: block;
      filter: drop-shadow(0 8px 24px rgba(122, 36, 68, 0.25));
    }

    .greeting-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.9rem;
      color: var(--burgundy);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 4px;
      opacity: 0;
      animation: fadeInUp 0.8s 0.9s forwards;
    }

    .recipient-text {
      font-family: 'Dancing Script', cursive;
      font-size: 1.6rem;
      color: var(--olive);
      font-weight: 600;
      margin-bottom: 24px;
      opacity: 0;
      animation: fadeInUp 0.8s 1.1s forwards;
    }

    .btn-open {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--cream);
      background: var(--burgundy);
      border: none;
      padding: 14px 40px;
      border-radius: 2px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: background 0.3s, transform 0.2s;
      box-shadow: 0 4px 16px rgba(122, 36, 68, 0.3);
      opacity: 0;
      animation: fadeInUp 0.8s 1.3s forwards;
    }

    .btn-open::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
      transition: left 0.5s;
    }

    .btn-open:hover {
      background: var(--burgundy-light);
      transform: translateY(-1px);
    }

    .btn-open:hover::before {
      left: 100%;
    }

    .btn-open:active {
      transform: translateY(0);
    }

    /* ===== PAGE 2 - VIDEO ===== */
    #page-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cream);
      overflow: hidden;
      z-index: 1;
    }

    /* Outer floral border for page 2 */
    .page2-floral-border {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .page2-corner {
      position: absolute;
      width: 140px;
      height: 140px;
      opacity: 0.8;
    }

    .page2-corner.tl {
      top: 0;
      left: 0;
    }

    .page2-corner.tr {
      top: 0;
      right: 0;
      transform: scaleX(-1);
    }

    .page2-corner.bl {
      bottom: 0;
      left: 0;
      transform: scaleY(-1);
    }

    .page2-corner.br {
      bottom: 0;
      right: 0;
      transform: scale(-1, -1);
    }

    .page2-side {
      position: absolute;
      width: 80px;
      opacity: 0.7;
    }

    .page2-side.left {
      left: 5px;
      top: 50%;
      transform: translateY(-50%);
    }

    .page2-side.right {
      right: 5px;
      top: 50%;
      transform: translateY(-50%) scaleX(-1);
    }

    /* Video frame card */
    .video-card-outer {
      position: relative;
      z-index: 1;
      width: min(340px, 88vw);
      background: #3d5218;
      border-radius: 16px;
      padding: 10px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
    }

    /* Scallop border effect */
    .video-card-outer::before {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 13px;
      border: 2px solid rgba(201, 168, 76, 0.5);
      pointer-events: none;
      z-index: 2;
    }

    .video-card-inner {
      background: var(--cream-dark);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .video-header {
      padding: 14px 16px 8px;
      text-align: center;
      background: var(--cream-dark);
    }

    .video-header .the-wedding {
      font-family: 'Dancing Script', cursive;
      font-size: 1.2rem;
      color: var(--burgundy);
      font-weight: 600;
      line-height: 1.2;
    }

    .video-frame-container {
      position: relative;
      width: 100%;
      padding-bottom: 0;
      background: #000;
    }

    /* Decorative vine overlay on video */
    .video-vine-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
    }

    video {
      width: 100%;
      display: block;
      aspect-ratio: 9/16;
      object-fit: cover;
    }

    .video-footer {
      padding: 10px 16px 14px;
      text-align: center;
      background: var(--cream-dark);
    }

    .video-footer .names {
      font-family: 'Dancing Script', cursive;
      font-size: 1.4rem;
      color: var(--burgundy);
      font-weight: 700;
    }

    .video-footer .subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.8rem;
      color: var(--olive);
      letter-spacing: 0.1em;
      margin-top: 2px;
    }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===== RESPONSIVE ===== */
    @media (min-width: 600px) {

      /* Laptop: centered card layout */
      #page-cover,
      #page-video {
        background: #d9cfc4;
      }

      .pages-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #page-cover {
        width: 390px;
        height: 844px;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        border-radius: 8px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        overflow: hidden;
      }

      #page-cover.slide-up {
        transform: translate(-50%, -150%);
      }

      #page-video {
        width: 390px;
        height: 844px;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        border-radius: 8px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        overflow: hidden;
      }
    }

    @media (max-width: 599px) {
      .mirror-frame {
        width: min(240px, 65vw);
      }

      .video-card-outer {
        width: min(300px, 82vw);
      }

      .corner-decor {
        width: 120px;
        height: 120px;
      }

      .side-flowers {
        width: 70px;
      }
    }
  </style>
</head>

    function openInvitation() {
      const cover = document.getElementById('page-cover');
      cover.classList.add('slide-up');

      // Auto-play video with sound after animation
      setTimeout(() => {
        const video = document.getElementById('weddingVideo');
        video.muted = false;
        video.play().catch(() => {
          // If autoplay with sound blocked, play muted
          video.muted = true;
          video.play();
        });
      }, 700);
    }
